# Test value
test_value: 1

# Test numerical data transformations
test_numerical_data_transformations:
  feature_engineering:
    include: False
    module: None
  imputation:
    include: True
    module: 'SimpleImputer'
  standardisation:
    include: False
    module: None
  normalization:
    include: False
    module: None

# Test categorical data transformations
test_categorical_data_transformations:
  imputation:
    include: True
    module: 'SimpleImputer'
  one_hot_encoding:
    include: True
    module: 'OneHotEncoder'

# Test regression metrics
test_regression_metrics:
  - 'RMSE'
  - 'MSE'
  - 'MAE'
  - 'MAPE'
  - 'R2 Score'

# Test multi classification metrics
test_multi_classification_metrics:
  - 'Accuracy'
  - 'Precision'
  - 'Recall'
  - 'F1 Score'
  - 'ROC AUC'

# Test label data transformations
test_label_data_transformations:
  one_hot_encoding:
    include: True
    module: 'OneHotEncoder'