# -------- Exploratory Data Analysis --------
healthcare_dataset_config:
  data_path:
    - 'data'
    - 'raw'
    - 'healthcare_dataset.csv'
  date_columns:
  - 'Date of Admission'
  - 'Discharge Date'
# ------------------------------------------


# -------- Data Preparation --------
healthcare_data_pipeline_config:
  data_transformations:
    numerical:
      feature_engineering:
        include: False
        module: None
      imputation:
        include: True
        module: 'SimpleImputer'
      standardisation:
        include: True
        module: 'MinMaxScaler'
      normalization:
        include: False
        module: None
    categorical:
      imputation:
        include: True
        module: 'SimpleImputer'
      one_hot_encoding:
        include: True
        module: 'OneHotEncoder'
  features:
    numerical:
      - 'Age'
      - 'Billing Amount'
      - 'Room Number'
    categorical:
      - 'Gender'
      - 'Blood Type'
      - 'Medical Condition'
      - 'Insurance Provider'
      - 'Admission Type'
      - 'Medication'
  labels:
    - 'Test Results'
  train_test_split:
    test_size: 0.33
    random_state: 108
# ----------------------------------

# ----------- Model Training -------------
model_training_config:
  mlflow:
    experiment_name: 'Version 1.0.x'
  metrics:
    - 'Accuracy'
    - 'Precision'
    - 'Recall'
    - 'F1 Score'
    - 'ROC AUC'
  logistic_regression:
    model_name: 'logistic_regression'
    mlflow_run_name: 'Logistic Regression'
  xgboost:
    model_name: 'xgboost'
    mlflow_run_name: 'XGBoost'
    parameters:
      booster: 'gbtree'
      objective: 'multi:softmax'
      num_class: 3
      eval_metric: 'mlogloss'
# ---------------------------------------